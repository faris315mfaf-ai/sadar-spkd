; Face photos and doctor notes are uploaded as base64 / files up to ~20 MB.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 512M
max_execution_time = 60
date.timezone = Asia/Jakarta
expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code is bind-mounted and updated with git pull, so keep checking timestamps.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
